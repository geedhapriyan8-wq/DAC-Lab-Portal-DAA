<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | DAC Lab Portal</title>
  <meta name="description" content="Sign in to the DAC Lab Portal to access your DSA or Data Analytics Academy labs, track your progress, and earn badges.">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/daa-theme.css">
</head>
<body class="theme-daa">
  <div class="animated-bg"></div>
  <div class="grid-overlay"></div>

  <div class="auth-page" role="main">
    <!-- Decorative orbs -->
    <div class="auth-orb auth-orb-1" aria-hidden="true"></div>
    <div class="auth-orb auth-orb-2" aria-hidden="true"></div>

    <div class="auth-container">
      <div class="glass-card auth-card">
        <!-- Highlighted Centered Brand -->
        <div class="auth-brand-centered">
          <div class="brand-logo-glow" aria-hidden="true">📊</div>
          <h1 class="brand-portal-title">DAC Lab Portal</h1>
          <span class="brand-portal-sub">DSA and Data Analytics Academy learning platform</span>
        </div>

        <!-- Header -->
        <div class="auth-header">
          <h2 class="auth-title">Welcome</h2>
          <p class="auth-subtitle">Sign in to your account to continue your learning journey.</p>
        </div>

        <!-- Alert (shown on error) -->
        <div id="login-alert" class="auth-alert error" style="display:none" role="alert">
          <span aria-hidden="true">⚠️</span>
          <span id="login-alert-msg"></span>
        </div>

        <!-- Login Form -->
        <form class="auth-form" id="login-form" novalidate autocomplete="on">
          <div class="form-group">
            <label class="form-label" for="login-userid">User ID</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">👤</span>
              <input
                type="text"
                id="login-userid"
                name="username"
                class="form-input"
                placeholder="Enter your user ID"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">🔑</span>
              <input
                type="password"
                id="login-password"
                name="current-password"
                class="form-input"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >
              <button type="button" class="input-toggle" id="toggle-pwd" aria-label="Toggle password visibility">👁</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">
            <span class="btn-text">Sign In →</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>
        </form>

        <!-- New password form (shown after an admin reset) -->
        <form class="auth-form" id="change-form" novalidate style="display:none">
          <div class="form-group" id="change-current-group">
            <label class="form-label" for="change-current">Temporary password</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">🔑</span>
              <input type="password" id="change-current" class="form-input" placeholder="The password your admin gave you" autocomplete="current-password">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="change-new">New password</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">🔒</span>
              <input type="password" id="change-new" class="form-input" placeholder="At least 8 characters" autocomplete="new-password">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="change-confirm">Confirm new password</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">🔒</span>
              <input type="password" id="change-confirm" class="form-input" placeholder="Type it again" autocomplete="new-password">
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg" id="change-btn">
            <span class="btn-text">Save New Password →</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>
        </form>

        <!-- Footer -->
        <div class="auth-footer" id="login-footer">
          Don't have an account?
          <a href="register.html" id="go-register-link">Create one here</a>
        </div>
        <div class="auth-footer" id="change-footer" style="display:none">
          Not you?
          <a href="#" id="switch-account-link">Sign in with a different account</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container" role="alert" aria-live="polite"></div>

  <script src="js/auth.js"></script>
  <script>
    const form     = document.getElementById('login-form');
    const alertEl  = document.getElementById('login-alert');
    const alertMsg = document.getElementById('login-alert-msg');
    const togglePwd = document.getElementById('toggle-pwd');
    const pwdInput  = document.getElementById('login-password');

    function showAlert(msg) {
      alertEl.style.display = 'flex';
      alertMsg.textContent  = msg;
    }

    togglePwd.addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      togglePwd.textContent = show ? '🙈' : '👁';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.style.display = 'none';

      const userId   = document.getElementById('login-userid').value.trim();
      const password = document.getElementById('login-password').value;
      const btn      = document.getElementById('login-btn');

      if (!userId || !password) {
        showAlert('Please fill in all fields.');
        return;
      }

      UI.setLoading(btn, true);
      await new Promise(r => setTimeout(r, 400));

      const result = await Auth.login(userId, password);

      if (result.ok && result.mustChangePassword) {
        UI.setLoading(btn, false);
        showChangeForm(password);
      } else if (result.ok) {
        UI.showToast({ type: 'success', title: 'Welcome!', message: `Signed in as @${userId}` });
        setTimeout(() => { window.location.href = result.home; }, 600);
      } else {
        UI.setLoading(btn, false);
        showAlert(result.message);
        document.getElementById('login-password').value = '';
        document.getElementById('login-password').focus();
      }
    });

    // Keyboard: press Enter
    document.getElementById('login-userid').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('login-password').focus();
    });

    /* ——— New password after an admin reset ——— */
    const changeForm = document.getElementById('change-form');
    let knownCurrentPassword = '';

    function showChangeForm(currentPassword) {
      knownCurrentPassword = currentPassword;
      alertEl.style.display = 'none';
      form.style.display = 'none';
      document.getElementById('login-footer').style.display = 'none';
      changeForm.style.display = '';
      document.getElementById('change-footer').style.display = '';
      document.getElementById('change-current-group').style.display = currentPassword ? 'none' : '';
      document.querySelector('.auth-title').textContent = 'Choose a new password';
      document.querySelector('.auth-subtitle').textContent =
        'An admin reset your password. Set a new one that only you know to continue.';
      document.getElementById(currentPassword ? 'change-new' : 'change-current').focus();
    }

    changeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.style.display = 'none';
      const current = knownCurrentPassword || document.getElementById('change-current').value;
      const next    = document.getElementById('change-new').value;
      const confirm = document.getElementById('change-confirm').value;
      const btn     = document.getElementById('change-btn');

      if (!current || !next || !confirm) { showAlert('Please fill in all fields.'); return; }
      if (next.length < 8) { showAlert('Password must be at least 8 characters.'); return; }
      if (next !== confirm) { showAlert('Passwords do not match.'); return; }

      UI.setLoading(btn, true);
      const result = await Auth.changePassword(current, next);
      if (result.ok) {
        UI.showToast({ type: 'success', title: 'Password updated', message: 'Taking you to your dashboard…' });
        setTimeout(() => { window.location.href = result.home; }, 600);
      } else {
        UI.setLoading(btn, false);
        showAlert(result.message);
      }
    });

    document.getElementById('switch-account-link').addEventListener('click', async (e) => {
      e.preventDefault();
      await Auth.logout();
      window.location.reload();
    });

    // Signed in already: go to the dashboard, or finish the password change first.
    Auth.requireGuest().then(session => {
      if (session && session.mustChangePassword) showChangeForm('');
    });
  </script>
</body>
</html>
